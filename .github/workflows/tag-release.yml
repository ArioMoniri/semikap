name: Tag release

# Creates the release tag named in .github/release-tag at the pushed commit.
# (Sessions that can only push branches use this; the desktop build is then
# started with `workflow_dispatch` of tauri-release.yml on the new tag, since
# tags pushed with GITHUB_TOKEN do not trigger workflows themselves.)
on:
  push:
    paths: ['.github/release-tag']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=$(head -n1 .github/release-tag | tr -d '[:space:]')
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          VERSION=$(jq -r .version package.json)
          [ "v$VERSION" = "$TAG" ] || { echo "::error::$TAG does not match package.json $VERSION"; exit 1; }
          EXISTING=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$EXISTING" ] || EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$GITHUB_SHA" ] || ! grep -qx retag .github/release-tag; then
              echo "$TAG already exists at $EXISTING — nothing to do (add a 'retag' line to move it)"; exit 0
            fi
            # Move the tag only while its release is unfinished: a draft, or missing latest.json
            # (the release workflow attaches latest.json last). Never rewrite a finished release.
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/rels.json
            for id in $(jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .id' /tmp/rels.json); do
              if gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[].name' | grep -qx latest.json; then
                echo "::error::$TAG release $id is finished (has latest.json) — not moving it"; exit 1
              fi
              echo "deleting unfinished release $id for $TAG"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            git push origin ":refs/tags/$TAG"
            echo "moved $TAG from $EXISTING"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "TAMIAS $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "created $TAG at $GITHUB_SHA"
