[package]
name = "tamias"
version = "0.16.2"
description = "TAMIAS — Transparent locAl Medical Image AnalysiS Tool (desktop wrapper)"
authors = ["Ariorad Moniri"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ArioMoniri/semikap"

[lib]
name = "tamias_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables the Web Inspector in PRODUCTION builds. Without it, users
# can't right-click → Inspect Element on the installed .app — meaning we can't
# diagnose worker / ORT failures unless we ship a debug build. The flag is
# already on in `tauri dev` regardless; this line just turns it on for `tauri
# build` too. Cost: a few hundred KB of WebKit inspector glue per binary.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
# v0.8.5 — opener plugin for revealItemInDir (Settings → Files browser
# "Show in Finder"). Replaces the old shell-API open helpers in Tauri 2.x.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Catalogue downloader (`catalog_fetch`): GitHub release assets send no CORS
# headers, so the WebView can't fetch them — Rust downloads instead. Same
# rustls + ring stack the updater plugin already compiles (no aws-lc/cmake).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
# Native ONNX Runtime backend (src/native_ort.rs): 3-D sliding-window tiles
# run in the Rust process instead of the WebView's WASM heap. Pinned to rc.10
# (ONNX Runtime 1.22): the last release whose prebuilt static binaries cover
# every desktop target we ship, x86_64-apple-darwin included. Linking is
# chosen by the `ort-static` / `ort-dynamic` features below.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }

[features]
default = ["custom-protocol", "ort-dynamic"]
custom-protocol = ["tauri/custom-protocol"]
# Dev / source builds: dlopen ONNX Runtime 1.22+ at runtime ($ORT_DYLIB_PATH,
# next to the executable, or the system library path). No download at build
# time; if no library is found the app falls back to in-WebView inference.
ort-dynamic = ["ort/load-dynamic"]
# Release builds (tauri-release.yml: --no-default-features --features
# custom-protocol,ort-static): statically link pyke's prebuilt ONNX Runtime,
# downloaded by ort-sys at build time. Nothing extra to bundle or sign.
ort-static = ["ort/download-binaries"]
